<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Browser tab icon. Next.js picks this up from app/icon.svg automatically.

    The S is drawn as five rectangles rather than set in a typeface: favicons
    render at 16x16, where hinting and font availability are both unreliable,
    and rectangles stay crisp at any size on any machine.
  -->
  <rect width="64" height="64" rx="14" fill="#050c17"/>
  <g fill="#22d3ee">
    <!-- top bar -->
    <rect x="16" y="14" width="32" height="9" rx="1.5"/>
    <!-- upper left stem -->
    <rect x="16" y="14" width="9" height="20" rx="1.5"/>
    <!-- middle bar -->
    <rect x="16" y="28" width="32" height="9" rx="1.5"/>
    <!-- lower right stem -->
    <rect x="39" y="28" width="9" height="22" rx="1.5"/>
    <!-- bottom bar -->
    <rect x="16" y="41" width="32" height="9" rx="1.5"/>
  </g>
</svg>
